name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vta
          POSTGRES_PASSWORD: vta_dev
          POSTGRES_DB: vta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vta" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://vta:vta_dev@localhost:5432/vta_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
